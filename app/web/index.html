<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAMBLE YOUR TOKENS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 24'%3E%3Cpath fill='%23ffcc00' d='M2 2h16v4h-6v16H8V6H2z M3 11h14v3H3z'/%3E%3C/svg%3E">
<style>
  /* Каркас. Цвета, шрифты, фон и характер — в themes/<тема>.css через переменные ниже. */
  :root {
    --bg: #101014; --ink: #f4f1ea; --dim: #a19d96; --mute: #5d5a55;
    --win: #3ddc84; --lose: #ff4d5e; --push: #9aa4ff; --gold: #ffcc33; --accent: #ff4d5e; --accent-ink: #fff;
    --panel: #1b1b21; --edge: #2c2c35; --deep: #0b0b0e; --chip: #26262e; --chip-on: #3d7bff; --chip-on-ink: #fff;
    --coin: #ffcc33; --coin-edge: #8a5b00; --c1: #ff4d5e; --c2: #3d7bff; --c3: #ffcc33; --c4: #3ddc84; --c5: #c070ff;
    --font-display: "Arial Black", Impact, "Segoe UI Black", system-ui, sans-serif;
    --font-ui: system-ui, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --radius: 16px; --shadow: 0 10px 0 var(--deep);
    --num-shadow: 0 5px 0 rgba(0,0,0,.5);
    --cell: min(140px, 22vw);
  }
  * { box-sizing: border-box; }
  html { overflow-x: hidden; overflow-y: auto; }   /* не влез по высоте — прокрутка, а не обрезанная кнопка */
  body { overflow: clip; }                          /* тряска стола не дёргает полосу прокрутки */
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-display); user-select: none; }
  canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  /* --z — масштаб стола, его ставит fit() в core.js: окно маленькое — стол целиком уменьшается, а не уезжает за край.
     zoom сжимает и min-height, поэтому делим на --z, чтобы сцена по-прежнему занимала всё окно. */
  #stage { position: relative; z-index: 1; min-height: calc(100dvh / var(--z, 1)); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 16px 16px 36px; zoom: var(--z, 1); }
  .tk { width: .62em; height: .78em; fill: currentColor; vertical-align: -.02em; margin-right: .06em; }
  button { font: inherit; color: var(--ink); cursor: pointer; border: 0; border-radius: 10px; position: relative; }
  button:disabled { cursor: default; }

  .wallet { text-align: center; line-height: 1; }
  .wallet .label { font: 700 13px var(--font-ui); letter-spacing: .4em; color: var(--dim); }
  .wallet .num { margin-top: 6px; font-size: clamp(46px, 8vw, 92px); color: var(--gold); display: inline-block;
    text-shadow: var(--num-shadow); font-variant-numeric: tabular-nums; }
  .wallet .num.empty { color: var(--mute); text-shadow: none; }
  .wallet .sub { margin-top: 10px; font: 600 13px/1.3 var(--font-mono); color: var(--dim); }
  .wallet .sub b { color: var(--ink); }
  .wallet .sub .up { color: var(--win); } .wallet .sub .down { color: var(--lose); }

  .src { margin: 10px auto 0; width: min(520px, 92vw); position: relative; }
  .src .bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--ink) 8%, transparent); gap: 2px; }
  .src .bar i { display: block; min-width: 3px; transition: flex-grow .8s ease; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; margin-top: 7px;
    font: 600 12px var(--font-mono); color: var(--dim); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .legend span::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .legend b { color: var(--ink); font-weight: 700; }
  .legend .zero { opacity: .45; }
  .legend .more { cursor: pointer; text-decoration: underline dotted; }
  .legend .more::before { display: none; }
  .src .all { position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 4; display: none; justify-content: flex-start;
    background: var(--panel); border: 3px solid var(--edge); border-radius: 12px; padding: 12px; max-height: 46vh; overflow: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  .src .all.open { display: flex; }

  #tabs { display: flex; gap: 6px; background: var(--deep); padding: 5px; border-radius: 14px; }
  #tabs button { background: transparent; padding: 8px 18px; font-size: 16px; color: var(--dim); }
  #tabs button.on { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 2px var(--edge); }
  #tabs button:disabled:not(.on) { opacity: .4; }

  .table { display: flex; gap: 16px; align-items: stretch; flex-wrap: wrap; justify-content: center; }
  .machine, .pays { background: var(--panel); border: 4px solid var(--edge); border-radius: var(--radius); padding: 18px;
    box-shadow: var(--shadow); }
  .machine { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #game { position: relative; display: flex; justify-content: center; }

  .result { width: 100%; min-width: min(460px, 86vw); height: 88px; border-radius: 12px; background: var(--deep); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; line-height: 1; }
  .result .k { font: 700 13px var(--font-ui); letter-spacing: .3em; color: var(--dim); }
  .result .v { font-size: 36px; font-variant-numeric: tabular-nums; }
  .result .f { font: 700 13px var(--font-mono); color: var(--dim); }
  .result.win { background: color-mix(in srgb, var(--win) 14%, var(--deep)); box-shadow: inset 0 0 0 3px var(--win); }
  .result.win .k, .result.win .v { color: var(--win); }
  .result.lose { background: color-mix(in srgb, var(--lose) 14%, var(--deep)); box-shadow: inset 0 0 0 3px var(--lose); }
  .result.lose .k, .result.lose .v { color: var(--lose); }
  .result.push { box-shadow: inset 0 0 0 3px var(--push); }
  .result.push .k, .result.push .v { color: var(--push); }
  .result.broke .v { color: var(--mute); font-size: 24px; }
  .result.spin .v { animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { opacity: .45; } }
  #quote { min-height: 18px; font: 700 14px/1.3 var(--font-mono); color: var(--dim); text-align: center; max-width: 460px; }

  .pays { display: flex; flex-direction: column; gap: 6px; width: 250px; justify-content: center; }
  .pays .h { font: 700 12px var(--font-ui); letter-spacing: .3em; color: var(--dim); margin-bottom: 4px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 10px; border-radius: 8px;
    font-size: 16px; transition: background .2s; }
  .row .s { display: flex; gap: 6px; font-size: 15px; }
  .row .x { color: var(--gold); }
  .row.lit { background: var(--gold); color: var(--deep); animation: lit .45s ease-in-out 3 alternate; }
  .row.lit .x, .row.lit .s, .row.lit .s * { color: var(--deep) !important; }
  @keyframes lit { to { filter: brightness(1.3); } }

  .controls { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; justify-content: center; }
  .bet { background: var(--chip); padding: 9px 14px 8px; font-size: 18px; box-shadow: 0 5px 0 var(--deep); min-width: 86px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .bet small { font: 700 12px var(--font-mono); color: var(--dim); }
  .bet.on { background: var(--chip-on); color: var(--chip-on-ink); }
  .bet.on small { color: inherit; opacity: .85; }
  .bet:disabled:not(.on) { opacity: .5; }
  kbd { position: absolute; top: 3px; right: 6px; font: 700 10px var(--font-mono); opacity: .45; }
  #primary { background: var(--accent); color: var(--accent-ink); font-size: 28px; padding: 10px 36px; box-shadow: 0 8px 0 color-mix(in srgb, var(--accent) 45%, #000);
    letter-spacing: .08em; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 200px; }
  #primary small { font: 700 13px var(--font-mono); letter-spacing: 0; opacity: .85; }
  button:active:not(:disabled), button.press { transform: translateY(5px); }
  #primary:disabled { background: var(--chip); box-shadow: 0 8px 0 var(--deep); color: var(--mute); }

  #banner { position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center;
    pointer-events: none; font-size: clamp(56px, 12vw, 150px); color: var(--gold); opacity: 0; text-shadow: var(--num-shadow); }
  .foot { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; z-index: 2; font: 600 12px var(--font-mono); color: var(--mute); }
  .corner { position: absolute; top: 12px; right: 14px; z-index: 7;   /* внутри #stage: уменьшается вместе со столом */
    display: flex; gap: 8px; align-items: center; }
  .corner > button { background: var(--panel); width: 40px; height: 40px; font-size: 20px; box-shadow: inset 0 0 0 2px var(--edge); }
  #langBtn { font: 700 13px var(--font-ui); }
  #langBtn:disabled { opacity: .4; }
  #langMenu { position: absolute; top: calc(100% + 8px); right: 0; display: none; flex-direction: column; gap: 2px; padding: 6px;
    background: var(--panel); border: 3px solid var(--edge); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  #langMenu.open { display: flex; }
  #langMenu button { background: transparent; padding: 7px 12px; font: 700 14px var(--font-ui); text-align: left; white-space: nowrap; color: var(--dim); }
  #langMenu button:hover, #langMenu button.on { background: var(--deep); color: var(--ink); }
  #themes { position: fixed; top: 12px; left: 14px; z-index: 7; display: flex; gap: 4px; background: var(--deep); padding: 4px; border-radius: 12px; }
  #themes:empty { display: none; }
  #themes button { background: transparent; padding: 6px 10px; font: 700 12px var(--font-ui); color: var(--dim); }
  #themes button.on { background: var(--panel); color: var(--ink); }

  #modal { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); backdrop-filter: blur(3px); }
  body.modal #modal { display: flex; }
  .sheet { position: relative; background: var(--panel); border: 4px solid var(--edge); border-radius: var(--radius); padding: 24px 28px; width: min(440px, 92vw); max-height: 88vh; overflow: auto; }
  .sheet h2 { margin: 0 0 14px; font-size: 22px; letter-spacing: .2em; color: var(--gold); }
  .sheet h3 { margin: 18px 0 8px; font: 700 12px var(--font-ui); letter-spacing: .3em; color: var(--dim); }
  .sheet .close { position: absolute; top: 10px; right: 12px; background: transparent; font-size: 26px; color: var(--dim); }
  .records { padding: 20px; }
  .records h2 { padding-right: 40px; overflow-wrap: anywhere; }
  .records-list { display: grid; gap: 4px; }
  .records .rrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 4px 12px; padding: 10px 12px; border-radius: 4px; }
  .records .rrow:nth-child(odd) { background: var(--deep); }
  .records .rlabel { grid-column: 1; grid-row: 1; min-width: 0; overflow-wrap: anywhere; }
  .records .rvalue { grid-column: 2; grid-row: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .records .rlabel, .records .rvalue { margin: 0; font: 600 14px/20px var(--font-ui); color: var(--ink); }
  .records .rsub { grid-column: 1; grid-row: 2; min-width: 0; font: 400 12px/16px var(--font-ui); color: var(--dim); overflow-wrap: anywhere; }
  .records .rsub time { display: block; white-space: nowrap; }
  .records .rvalue.up { color: var(--win); }
  .records .rvalue.down { color: var(--lose); }
  .records .rvalue.earned { color: var(--gold); }

  body.glitch #stage { animation: glitch .09s steps(2) infinite; }
  @keyframes glitch { 0% { transform: translate(6px,-3px) skewX(4deg); filter: hue-rotate(90deg) saturate(3); clip-path: inset(10% 0 30% 0); }
    100% { transform: translate(-8px,4px) skewX(-6deg); filter: hue-rotate(-60deg) invert(.2); clip-path: inset(0 0 0 0); } }

  /* Ступени сжатия (fit() в core.js включает их по очереди, пока стол с кнопками не влезет в окно):
     c1 — кошелёк в одну строку слева сверху, без источников, цитаты и подписи; c2 — выплаты уходят под кнопки, табло ниже;
     c3 — «широкий» вариант для коротких окон: ставки и главная кнопка в один ряд (игры могут перестроиться по body.c3). */
  body.c1 #stage { padding: 52px 12px 10px; gap: 10px; }
  body.c1 .wallet { position: absolute; top: 8px; left: 10px; min-height: 34px; display: flex; align-items: center; }
  body.c1 .wallet .label, body.c1 .wallet .sub, body.c1 .src, body.c1 #quote, body.c1 .foot { display: none; }
  html body.c1 .wallet .num { font-size: 30px; margin: 0; }
  body.c1 .corner { top: 8px; right: 8px; gap: 6px; }
  body.c1 .corner > button { width: 34px; height: 34px; font-size: 16px; }
  body.c2 .table { display: contents; } body.c2 .pays { order: 1; width: min(100%, 460px); }
  body.c2 .result { height: 66px; } body.c2 .machine { gap: 10px; padding: 12px; }
  body.c3 .controls { flex-wrap: nowrap; width: auto; max-width: none; }
  body.c3 .bet { flex: none; min-width: 74px; }
  body.c3 #primary { width: auto; min-width: 170px; }

  @media (min-width: 761px) and (max-height: 820px) {   /* ноутбук 1280×720: стол целиком без прокрутки */
    #stage { gap: 10px; padding-top: 10px; }
    html .wallet .num { font-size: clamp(40px, 8vh, 64px); margin-top: 2px; }   /* html — сильнее правил тем */
    .wallet .sub { margin-top: 6px; }
  }
  @media (max-width: 760px) {
    #stage { justify-content: flex-start; padding: 64px 12px 48px; gap: 12px; }
    .pays { width: 100%; } .row { padding: 3px 8px; font-size: 14px; } .pays .h { display: none; }
    .result { height: 74px; min-width: 0; } .result .v { font-size: 28px; }
    .foot { position: static; padding: 0 16px 12px; }
    .table { display: contents; } .pays { order: 1; }   /* выплаты под кнопками: SPIN сразу под столом */
    #themes { right: 168px; overflow-x: auto; scrollbar-width: none; }   /* справа три угловые кнопки */
  }
</style>
<link id="themeCss" rel="stylesheet" href="themes/pixel.css">
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage">
  <div class="corner">
    <button id="recBtn" data-t-title="records">🏆</button>
    <button id="shareBtn" data-t-title="share">📸</button>
    <button id="mute" data-t-title="sound">🔊</button>
    <button id="langBtn" data-t-title="language"></button>
    <div id="langMenu"></div>
  </div>
  <div class="wallet">
    <div class="label" data-t="tokens"></div>
    <div class="num" id="bal">…</div>
    <div class="sub" id="sub"></div>
    <div class="src"><div class="bar" id="srcBar"></div><div class="legend" id="srcLegend"></div><div class="legend all" id="srcAll"></div></div>
  </div>
  <nav id="tabs"></nav>
  <div class="table">
    <div class="machine">
      <div id="game"></div>
      <div class="result" id="result"><div class="k" id="rk"></div><div class="v" id="rv"></div><div class="f" id="rf"></div></div>
      <div id="quote"></div>
    </div>
    <div class="pays" id="rules"></div>
  </div>
  <div class="controls">
    <button class="bet" data-f="0.1">10%<small></small><kbd>1</kbd></button>
    <button class="bet" data-f="0.25">25%<small></small><kbd>2</kbd></button>
    <button class="bet" data-f="0.5">50%<small></small><kbd>3</kbd></button>
    <button class="bet" data-f="1"><span data-t="betAll"></span><small></small><kbd>4</kbd></button>
    <button id="primary"><span>SPIN</span><small id="primaryAmt"></small><kbd>␣</kbd></button>
  </div>
</div>
<canvas id="fx"></canvas>
<div id="banner"></div>
<div id="themes"></div>
<div id="modal"></div>
<div class="foot" data-t="foot"></div>
<script type="module" src="core.js"></script>
</body>
</html>
